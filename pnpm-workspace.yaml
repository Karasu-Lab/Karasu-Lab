packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  '@karasu-lab/api-permissions': 'workspace:*'
  '@karasu-lab/challengetoken': 'workspace:*'
  '@karasu-lab/flags': 'workspace:*'
  '@karasu-lab/sdk': 'workspace:*'
  '@karasu-lab/sse': 'workspace:*'
  '@karasu-lab/types': 'workspace:*'
  '@karasu-lab/ui': 'workspace:*'
  '@karasu-lab/utils': 'workspace:*'
  'better-auth@1.7.12>@better-auth/utils': 0.5.1
  jwks-rsa>jose: '^5.10.0'
  zod@^4: 4.5.4
  jose@^6: 6.2.5

patchedDependencies:
  better-auth-email-challenge@0.1.5: apps/api-auth.karasu256.com/patches/better-auth-email-challenge@0.1.5.patch

allowBuilds:
  '@tailwindcss/oxide': true
  sharp: true
  unrs-resolver: true
  '@firebase/util': true
  protobufjs: true
  esbuild: true
  workerd: true
  '@swc/core': true
  simple-git-hooks: true
  core-js: true
  '@parcel/watcher': true
  cpu-features: true
  ssh2: true
