name = "cdn-karasu256-com"
main = "src/index.ts"
compatibility_date = "2025-06-24"

[[env.production.routes]]
pattern = "cdn.karasu256.com"
custom_domain = true

[[env.production.r2_buckets]]
binding = "IMAGES"
bucket_name = "karasu-lab-cdn"

# Created via `wrangler kv namespace create RATE_LIMIT_KV`.
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "dda7387a349f4de3b1698f20e713294d"

[env.production.vars]
CDN_BASE_URL = "https://cdn.karasu256.com"
AUTH_URL = "https://api-auth.karasu256.com"

[env.dev]
routes = []

[[env.dev.r2_buckets]]
binding = "IMAGES"
bucket_name = "karasu-lab-cdn-dev"
remote = true

# Created via `wrangler kv namespace create RATE_LIMIT_KV --env dev`; replace
# the id below with the value that command prints.
[[env.dev.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "c3fb9b94d2074304986c58049620d0b4"
remote = true

[env.dev.vars]
CDN_BASE_URL = "http://localhost:8788"
AUTH_URL = "http://localhost:8790"

[env.local]
routes = []

[[env.local.r2_buckets]]
binding = "IMAGES"
bucket_name = "karasu-lab-cdn-local"

[[env.local.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "local-rate-limit-kv"

[env.local.vars]
CDN_BASE_URL = "http://localhost:8788"
AUTH_URL = "http://localhost:8790"
UPLOAD_TICKET_SECRET = "local-development-upload-ticket-secret"
CRON_JOBS_API_KEY = "local-development-cron-jobs-api-key"

[[env.preview.routes]]
pattern = "dev.cdn.karasu256.com"
custom_domain = true

[[env.preview.r2_buckets]]
binding = "IMAGES"
bucket_name = "karasu-lab-cdn-dev"
remote = true

# Created via `wrangler kv namespace create RATE_LIMIT_KV --env dev`; replace
# the id below with the value that command prints.
[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "c3fb9b94d2074304986c58049620d0b4"
remote = true

[env.preview.vars]
CDN_BASE_URL = "https://dev.cdn.karasu256.com"
AUTH_URL = "https://dev-api-auth.karasu256.com"

[observability.logs]
enabled = true
invocation_logs = false
