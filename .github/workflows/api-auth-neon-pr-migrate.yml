name: api-auth.karasu256.com PR Migrations

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - apps/api-auth.karasu256.com/drizzle/migrations/**
      - .github/workflows/api-auth-neon-pr-migrate.yml

concurrency:
  group: api-auth-neon-dev-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve the dev database
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node .github/scripts/neon-branch-url.mjs dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm --filter api-auth.karasu256.com db:migrate:deploy
